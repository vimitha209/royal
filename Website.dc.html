      name: c.name, img: IMG[c.im], bg: TINTS[CATS.indexOf(c) % TINTS.length],
      active: sugActive === i ? 'is-active' : '', selected: sugActive === i,
      pick: () => this.go('catalog', Object.assign({ cat: c.slug, q: '', qDraft: '' }, closeSug))
    }));
    const sugProdVm = sugProducts.map((p, j) => Object.assign(vm(p), {
      catName: catName[p.cat] || '',
      active: sugActive === nSugCats + j ? 'is-active' : '', selected: sugActive === nSugCats + j,
      pick: () => this.go('product', Object.assign({ pid: p.id, qty: 1 }, closeSug))
    }));
    const sugPicks = sugCatVm.map((x) => x.pick).concat(sugProdVm.map((x) => x.pick));

    // Product
    const P = byId[s.pid] || PRODUCTS[0];
    const pd = Object.assign(vm(P), {
      catName: catName[P.cat], openCat: openCat(P.cat),
      thumbs: [0, 1, 2, 3].map((i) => ({ bg: TINTS[(P.idx + i) % TINTS.length], d: P.d, img: P.img, hasImg: !!P.img, noImg: !P.img })),
      waLink: wa('917053838682', 'Hi Royal Dark, I am interested in ' + P.name + ' (' + fmt(P.price) + '). Is it available?'),
      addQty: () => this.addToCart(P.id, s.qty),
      buyQty: () => { this.addToCart(P.id, s.qty, true); this.go('cart'); }
    });
    const related = PRODUCTS.filter((p) => p.id !== P.id && p.cat === P.cat)
      .concat(PRODUCTS.filter((p) => p.id !== P.id && p.cat !== P.cat)).slice(0, 6).map(vm);

    // Cart
    const cartItems = s.cart.filter((it) => byId[it.id]).map((it) => {
      const p = byId[it.id];
      return Object.assign(vm(p), {
        qty: it.qty, unitText: fmt(p.price) + ' each', lineText: fmt(p.price * it.qty),
        inc: () => this.setQty(p.id, it.qty + 1), dec: () => this.setQty(p.id, it.qty - 1), remove: () => this.setQty(p.id, 0)
      });
    });
    const cartCount = s.cart.reduce((a, b) => a + b.qty, 0);
    const sub = s.cart.reduce((a, it) => a + (byId[it.id] ? byId[it.id].price * it.qty : 0), 0);
    const disc = s.coupon === 'SAVE10' ? Math.round(sub * 0.1) : 0;
    const total = sub - disc;

    // Checkout
    const f = s.form;
    const digits = f.phone.replace(/\D/g, '');
    const missing = [];
    if (!f.name.trim()) missing.push('name');
    if (digits.length < 10) missing.push('10-digit phone');
    if (!f.address.trim()) missing.push('address');
    if (!/^\d{6}$/.test(f.pin.trim())) missing.push('6-digit pincode');
    const canOrder = cartCount > 0 && missing.length === 0;
    const payLabel = s.pay === 'cod' ? 'Cash on Delivery' : 'UPI after confirmation';
    const lines = cartItems.map((it) => '• ' + it.name + ' × ' + it.qty + ' = ' + it.lineText);
    const orderText = ['New order — Royal Dark', ''].concat(lines).concat([
      '', 'Subtotal: ' + fmt(sub),
      disc ? 'Coupon SAVE10: −' + fmt(disc) : null,
      'Total: ' + fmt(total), '',
      'Name: ' + f.name.trim(), 'Phone: ' + f.phone.trim(),
      'Address: ' + f.address.trim() + ', ' + f.city.trim() + ' - ' + f.pin.trim(),
      'Payment: ' + payLabel,
      f.notes.trim() ? 'Notes: ' + f.notes.trim() : null
    ]).filter((x) => x !== null).join('\n');
    const waOrder = wa('917053838682', orderText);

    // Contact & bulk
    const c = s.contact;
    const canContact = !!(c.name.trim() && c.msg.trim());
    const waContact = wa('917053838682', 'Hi Royal Dark, I am ' + c.name.trim() + (c.phone.trim() ? ' (' + c.phone.trim() + ')' : '') + '.\n\n' + c.msg.trim());
    const b = s.bulk;
    const canBulk = !!(b.shop.trim() && b.items.trim());
    const waBulk = wa('917053838682', 'Bulk order enquiry — Royal Dark\n\nShop: ' + b.shop.trim() + '\nPhone: ' + b.phone.trim() + '\nCity: ' + b.city.trim() + '\n\nProducts & quantities:\n' + b.items.trim());

    const catSelect = CATS.some((x) => x.slug === s.cat) ? s.cat : 'all';
    const page = s.page;
    return {
      I, cats, hero: slides[idx], dots, deals, sellers, arrivals, trust, why, bulkPoints, collage, insta,
      prevSlide: () => goSlide(idx - 1), nextSlide: () => goSlide(idx + 1),
      isHome: page === 'home', isCatalog: page === 'catalog', isProduct: page === 'product', isCart: page === 'cart',
      isCheckout: page === 'checkout', isSuccess: page === 'success', isContact: page === 'contact',
      isBulk: page === 'bulk', isAbout: page === 'about', isAccount: page === 'account',
      goHome: () => this.go('home'), goCatalog: openCat('all'), goTop: openCat('c:top'), goNew: openCat('c:new'), goDeals: openCat('c:deals'),
      goCart: () => this.go('cart', { toast: '' }), goCheckout: () => this.go('checkout'), goContact: () => this.go('contact'),
      goBulk: () => this.go('bulk'), goAbout: () => this.go('about'), goAccount: () => this.go('account', { authMsg: '' }),
      qDraft: s.qDraft, qDraftTrim: draft,
      setQDraft: (e) => this.setState({ qDraft: e.target.value, sugOpen: true, sugIdx: -1 }),
      doSearch: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const text = this.state.qDraft.trim();
        try { if (document.activeElement) document.activeElement.blur(); } catch (err) {}
        this.go('catalog', { q: text, qDraft: text, cat: catSelect, sort: 'featured', sugOpen: false, sugIdx: -1 });
      },
      showSugg: sugOn, sugCats: sugCatVm, sugProducts: sugProdVm,
      sugHasCats: nSugCats > 0, sugHasProducts: sugProdVm.length > 0,
      sugHasAny: sugTotal > 0, sugNone: sugOn && sugTotal === 0,
      sugFocus: () => { clearTimeout(this.blurT); if (!this.state.sugOpen) this.setState({ sugOpen: true }); },
      sugBlur: () => { clearTimeout(this.blurT); this.blurT = setTimeout(() => this.setState({ sugOpen: false, sugIdx: -1 }), 150); },
      keepFocus: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      sugKey: (e) => {
        if (e.key === 'Escape') { this.setState({ sugOpen: false, sugIdx: -1 }); return; }
        if (!sugOn || !sugTotal) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ sugIdx: sugActive < sugTotal - 1 ? sugActive + 1 : 0 }); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ sugIdx: sugActive > 0 ? sugActive - 1 : sugTotal - 1 }); }
        else if (e.key === 'Enter' && sugActive >= 0) { e.preventDefault(); sugPicks[sugActive](); }
      },
      hasSearchNote: !!searchNote, searchNote: searchNote,
      catSelect: catSelect, pickCatSelect: (e) => this.go('catalog', { cat: e.target.value }),
      q: s.q, hasQuery: !!q, clearQuery: () => this.setState({ q: '', qDraft: '' }),
      clearFilters: () => this.setState({ q: '', qDraft: '', cat: 'all' }),
      sort: s.sort, setSort: (e) => this.setState({ sort: e.target.value }),
      catTitle: catTitle, catSub: q ? 'Showing results for “' + s.q.trim() + '”' : 'Genuine accessories — order single pieces or in bulk.',
      collections, catFilters, results, hasResults: results.length > 0, noResults: results.length === 0,
      resultCount: results.length + (results.length === 1 ? ' product' : ' products'),
      pd, related, qty: s.qty,
      qtyInc: () => this.setState({ qty: Math.min(99, this.state.qty + 1) }),
      qtyDec: () => this.setState({ qty: Math.max(1, this.state.qty - 1) }),
      cartItems, cartCount, hasCart: cartCount > 0, cartEmpty: cartCount === 0,
      subText: fmt(sub), discText: fmt(disc), totalText: fmt(total), hasDiscount: disc > 0,
      couponDraft: s.couponDraft, setCouponDraft: (e) => this.setState({ couponDraft: e.target.value }),
      applyCoupon: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const code = this.state.couponDraft.trim().toUpperCase();
        if (code === 'SAVE10') this.setState({ coupon: 'SAVE10', couponOk: true, couponMsg: 'SAVE10 applied — 10% off your order.' });
        else this.setState({ coupon: '', couponOk: false, couponMsg: code ? 'That code isn’t valid. Try SAVE10.' : 'Enter a coupon code.' });
      },
      hasCouponMsg: !!s.couponMsg, couponMsg: s.couponMsg, couponColor: s.couponOk ? '#1f7a3f' : '#b42318',
      form: f, fName: setF('form', 'name'), fPhone: setF('form', 'phone'), fAddress: setF('form', 'address'),
      fCity: setF('form', 'city'), fPin: setF('form', 'pin'), fNotes: setF('form', 'notes'),
      payCod: s.pay === 'cod', payUpi: s.pay === 'upi',
      pickCod: () => this.setState({ pay: 'cod' }), pickUpi: () => this.setState({ pay: 'upi' }),
      canOrder, cantOrder: !canOrder,
      orderHint: 'Add your ' + missing.join(', ') + ' to place the order.',
      waOrder,
      placeOrder: () => {
        this.setState({ lastOrder: { count: cartCount, total: fmt(total), link: waOrder }, cart: [], coupon: '', couponDraft: '', couponMsg: '', page: 'success' });
        try { window.scrollTo(0, 0); } catch (e) {}
      },
      lastCount: s.lastOrder ? s.lastOrder.count : 0, lastTotal: s.lastOrder ? s.lastOrder.total : '', lastLink: s.lastOrder ? s.lastOrder.link : waOrder,
      contact: c, cName: setF('contact', 'name'), cPhone: setF('contact', 'phone'), cMsg: setF('contact', 'msg'),
      canContact, cantContact: !canContact, waContact,
      bulk: b, bShop: setF('bulk', 'shop'), bPhone: setF('bulk', 'phone'), bCity: setF('bulk', 'city'), bItems: setF('bulk', 'items'),
      canBulk, cantBulk: !canBulk, waBulk,
      waDilip: wa('917053838682', 'Hi Royal Dark, I have a question about your products.'),
      waRohit: wa('918750284942', 'Hi Royal Dark, I have a question about your products.'),
      mapsLink: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('283/A3, Than Singh Nagar, Anand Parbat, Near CNG Pump, New Delhi 110005'),
      isLoginTab: s.authTab === 'login', isRegTab: s.authTab === 'register',
      tabLoginOn: s.authTab === 'login' ? 'is-on' : '', tabRegOn: s.authTab === 'register' ? 'is-on' : '',
      tabLogin: () => this.setState({ authTab: 'login', authMsg: '' }), tabReg: () => this.setState({ authTab: 'register', authMsg: '' }),
      authSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ authMsg: 'Online accounts are coming soon. You can still order now — checkout sends your order to us on WhatsApp.' }); },
      hasAuthMsg: !!s.authMsg, authMsg: s.authMsg,
      quick: [['Home', () => this.go('home')], ['About Us', () => this.go('about')], ['Catalog', openCat('all')], ['New Arrivals', openCat('c:new')], ['Best Deals', openCat('c:deals')], ['Contact Us', () => this.go('contact')]].map((l) => ({ name: l[0], go: l[1] })),
      footCats: cats.slice(0, 8),
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
</body>
</html>
